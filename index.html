<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wyszukiwarka adresów</title>
	<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
    body {
    background-image: url('mapa-sepia.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    font-family: "Calibri", serif;
    color: #2b1b0e;
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center; /* poziome wyśrodkowanie */
    align-items: center;     /* pionowe wyśrodkowanie */
}

.formularz {
    background-color: rgba(255, 248, 240, 0.85);
    padding: 20px 30px;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(60, 40, 20, 0.5);
    text-align: center;
}

input, select, button {
    margin: 5px;
    padding: 6px 10px;
    border: 1px solid #8b6b4a;
    border-radius: 4px;
    background-color: rgba(255, 255, 255, 0.9);
}

#map {
    margin-top: 15px;
    border: 2px solid #8b6b4a;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(60, 40, 20, 0.5);
}
#map {
    width: 500px;
    height: 250px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.6s ease-in-out;
}

#map.aktywny {
    opacity: 1;
    visibility: visible;
}
#sekcja-adresowa {
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.6s ease-in-out;
}

#sekcja-adresowa.aktywny {
    opacity: 1;
    visibility: visible;
}

</style>

</head>
<body>
<div class="formularz">
<h2>Wyszukiwarka adresów po kodzie pocztowym</h2>

<label>Kod pocztowy:
    <input type="text" id="kod" placeholder="np. 26-604">
</label>
<button onclick="pobierzDane()">Szukaj</button>

<br><br>
<div id="sekcja-adresowa">
<label>Miejscowość:
    <select id="miejscowosci" onchange="wypelnijUlice()">
        <option value="">-- wybierz --</option>
    </select>
</label>

<br><br>

<label>Ulica:
    <select id="ulice">
        <option value="">-- wybierz --</option>
    </select>
</label>

<br><br>

<label>Numer domu:
    <input type="text" id="numer">
</label>
<button onclick="pokazMape()">Pokaż na mapie</button>

<br><br>
</div>
<div id="map" style="width: 500px; height: 250px;"></div>


<script>
let daneAPI = []; // tu przechowamy dane pobrane z API

async function pobierzDane() {
    const kod = document.getElementById("kod").value.trim();
    const selectM = document.getElementById("miejscowosci");
    const selectU = document.getElementById("ulice");

    selectM.innerHTML = '<option value="">-- wybierz --</option>';
    selectU.innerHTML = '<option value="">-- wybierz --</option>';

    if (!kod) return;

    try {
        const response = await fetch(`https://kodpocztowy.intami.pl/api/${kod}`);
        const data = await response.json();

        daneAPI = data;

        if (!Array.isArray(data) || data.length === 0) {
            alert("Brak danych dla tego kodu pocztowego");
            return;
        }

        // 🔥 Pokaż sekcję z polami
        document.getElementById("sekcja-adresowa").classList.add("aktywny");

        const miejscowosci = [...new Set(data.map(item => item.miejscowosc))];

        miejscowosci.forEach(m => {
            const opt = document.createElement("option");
            opt.value = m;
            opt.textContent = m;
            selectM.appendChild(opt);
        });

    } catch (e) {
        console.error(e);
        alert("Błąd podczas pobierania danych");
    }
}


function wypelnijUlice() {
    const wybranaMiejscowosc = document.getElementById("miejscowosci").value;
    const selectU = document.getElementById("ulice");

    // czyścimy listę ulic
    selectU.innerHTML = '<option value="">-- wybierz --</option>';

    if (!wybranaMiejscowosc) return;

    // filtrujemy ulice tylko z wybranej miejscowości
    const ulice = daneAPI
        .filter(item => item.miejscowosc === wybranaMiejscowosc)
        .map(item => item.ulica)
        .filter(u => u && u.trim() !== "");

    const unikalneUlice = [...new Set(ulice)];

    unikalneUlice.forEach(u => {
        const opt = document.createElement("option");
        opt.value = u;
        opt.textContent = u;
        selectU.appendChild(opt);
    });
}
</script>
<script>
let mapa = null;
let marker = null;

async function pokazMape() {
    const kod = document.getElementById("kod").value.trim();
    const miejscowosc = document.getElementById("miejscowosci").value;
    const ulica = document.getElementById("ulice").value;
    const numer = document.getElementById("numer").value.trim();

    if (!kod || !miejscowosc || !ulica || !numer) {
        alert("Wypełnij wszystkie pola");
        return;
    }

    const adres = `${ulica} ${numer}, ${miejscowosc}, ${kod}, Polska`;
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(adres)}`;

    try {
        const response = await fetch(url, {
            headers: { "User-Agent": "TwojaAplikacjaAdresowa/1.0" }
        });
        const data = await response.json();

        if (!data || data.length === 0) {
            alert("Nie znaleziono lokalizacji dla tego adresu");
            return;
        }

        const lat = data[0].lat;
        const lon = data[0].lon;

        // 🔥 Pokaż mapę z animacją
        const mapDiv = document.getElementById("map");
        mapDiv.classList.add("aktywny");

        if (!mapa) {
            mapa = L.map('map');
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(mapa);
        }

        mapa.setView([lat, lon], 17);

        if (marker) mapa.removeLayer(marker);

        marker = L.marker([lat, lon]).addTo(mapa)
            .bindPopup(adres)
            .openPopup();

        // 🔧 Kluczowe — poprawne przeliczenie rozmiaru po pojawieniu się
        setTimeout(() => mapa.invalidateSize(), 300);

    } catch (e) {
        console.error(e);
        alert("Błąd podczas pobierania lokalizacji");
    }
}
</script>
</div>
</body>
</html>
